# Site Configuration
title: Lionel Kanyowa
description: "Systems administrator expanding into software engineering. Learning in public through Launch School — a study log, longer writing, and videos."
url: "https://lionelkanyowa.com"

# Social / SEO (jekyll-seo-tag)
twitter:
  username: layoiscoding
  card: summary_large_image

# Personal Information
author:
  name: Lionel Kanyowa
  email: lionelkanyowa@gmail.com
  linkedin: lionel-kanyowa
  github: lionelkanyowa
  medium: lionelkanyowa
  instagram: layoiscoding
  youtube: lionelkanyowa
  twitter: layoiscoding
  location: "Michigan"

# Build Settings
timezone: America/Detroit   # render dates in Michigan time, not UTC
future: true   # publish study-log entries written/timestamped later the same day
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Study log posts live under /studylog/
permalink: /studylog/:title/

# Plugins (Jekyll 4 — the build is ours via GitHub Actions, no allowlist)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Keep internal files out of the published site
exclude:
  - CLAUDE.md
  - README.md
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

# Navigation
navigation:
  - title: About
    url: /about/
  - title: Journey
    url: /journey/
  - title: Projects
    url: /projects/
  - title: Study Log
    url: /studylog/
  - title: Videos
    url: /videos/

# Default Open Graph / Twitter image for every page
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
