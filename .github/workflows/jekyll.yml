name: Build and deploy Jekyll site

on:
  push:
    branches: [main]
  # Build every pull request (any base branch, so stacked PRs get a check too).
  # Pull requests only build and check; they never deploy.
  pull_request:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Deploys run one at a time and are never cancelled. A pull request's
# checks get their own group, and a newer push to the PR replaces an older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Uses the version in .ruby-version so CI matches local exactly.
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Copy awaiting Lionel's confirmation is marked [CONFIRM] in source
      # comments and PR descriptions. It must never reach the published site.
      - name: Check for unconfirmed copy
        run: |
          if grep -rIl -F '[CONFIRM]' _site; then
            echo "::error::[CONFIRM] marker found in the built site (files listed above)."
            exit 1
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
