# Core Curriculum — the two branches of Launch School's Core, in order.
#
# Update a course's `status` as you progress; the branch sub-status
# ("Complete" / "In progress · N/M" / "Not started") is derived automatically
# from the course statuses, so this file is the only thing to edit.
#
# status: one of
#   done      — assessment passed
#   current   — actively working through it now
#   upcoming  — not started yet

prep:
  - code: LS95
    title: "Orientation"
    status: done
  - code: RB100
    title: "Programming & Back-end Prep"
    status: current

